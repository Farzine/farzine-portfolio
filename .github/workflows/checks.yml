name: Portfolio checks
on:
  push:
    branches: [version3]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: docker run --detach --rm --name farzine-portfolio-phase2-db --publish 127.0.0.1:54329:5432 --env POSTGRES_PASSWORD=local-policy-test-only postgres:17-alpine
      - run: npm run test:db
      - run: npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: npm run test:fixtures:local
      - run: npm run build:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production-boundary
      - run: npm run test:e2e:local
      - run: npm run test:security
      - if: always()
        run: npx supabase stop --no-backup
